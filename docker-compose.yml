name: parcheesi

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?définir MARIADB_ROOT_PASSWORD dans .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-parcheesi}
      MARIADB_USER: ${MARIADB_USER:-parcheesi}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?définir MARIADB_PASSWORD dans .env}
    command:
      - --default-storage-engine=InnoDB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MARIADB_USER:-parcheesi}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-parcheesi}
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-4000}:4000"

volumes:
  db_data:
